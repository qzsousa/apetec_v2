<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apetec - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Anonymous+Pro&display=swap" rel="stylesheet">
  <script src="./js/auth.js"></script>
  <link rel="stylesheet" href="./style/style.css">
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

<!-- Fundo animado original -->
<div class="background">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<!-- Formulário -->
<div class="login-container">

  <div class="typewriter-wrap">Bem-vindo à <span class="apetec">APETEC</span></div>
  <p class="titulo">Sistema de Achados e Perdidos Escolar</p>
  <p class="subtitulo">Faça seu login para continuar</p>

  <div class="tipo-selector">
    <button class="tipo-btn ativo" id="btn-aluno" onclick="selecionarTipo('aluno')">Aluno</button>
    <button class="tipo-btn" id="btn-secretaria" onclick="selecionarTipo('secretaria')">Secretaria</button>
  </div>

  <div class="form-grupo" id="grupo-cpf">
    <label for="input-cpf">CPF</label>
    <input type="text" id="input-cpf" placeholder="000.000.000-00">
  </div>

  <div class="form-grupo">
  <label for="input-senha">Senha</label>
  <div class="input-com-icone">
    <input type="password" id="input-senha" placeholder="••••••••">
    <button type="button" class="btn-olho" onclick="toggleSenha('input-senha', this)">
  <i class="fas fa-eye"></i>
</button>
</div>

  <div class="msg-erro" id="msg-erro"></div>

  <div class="btns">
    <button class="Entrar" onclick="fazerLogin()">Entrar</button>
    <button class="Registrar" onclick="window.location.href='register.html'">Registrar</button>
  </div>

</div>

<p class="rodape">Apetec · Sistema de Achados e Perdidos Escolar</p>

<script>
  let tipoAtual = 'aluno';

  function selecionarTipo(tipo) {
    tipoAtual = tipo;
    document.getElementById('btn-aluno').classList.toggle('ativo', tipo === 'aluno');
    document.getElementById('btn-secretaria').classList.toggle('ativo', tipo === 'secretaria');
    document.getElementById('msg-erro').style.display  = 'none';
    document.getElementById('grupo-cpf').style.opacity = '1';
  }
  
  async function fazerLogin() {
    const senha = document.getElementById('input-senha').value.trim();
    const erro  = document.getElementById('msg-erro');
    erro.style.display = 'none';

    const cpf = document.getElementById('input-cpf').value.trim();
    if (!cpf || !senha) { mostrarErro('Preencha CPF e senha.'); return; }

    const url = tipoAtual === 'aluno' 
    ? 'http://localhost:8000/auth/login/usuario'
    : 'http://localhost:8000/auth/login/secretaria';

    const body = { cpf, senha };

    try {
      const res  = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { mostrarErro('Credenciais inválidas. Tente novamente.'); return; }

      localStorage.setItem('token', data.access_token);
      localStorage.setItem('tipo_usuario', tipoAtual);
      window.location.href = 'dashboard.html';
    } catch {
      mostrarErro('Erro ao conectar com o servidor.');
    }
  }

  function mostrarErro(msg) {
    const el = document.getElementById('msg-erro');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

 function toggleSenha(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.innerHTML = isPassword
    ? '<i class="fas fa-eye-slash"></i>'  // agora está visível, mostra olho cortado
    : '<i class="fas fa-eye"></i>';       // voltou a ficar oculto, mostra olho aberto
}
</script>

</body>
</html>
